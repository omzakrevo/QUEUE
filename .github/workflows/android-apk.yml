name: Android APK

on:
  push:
    branches: [main, 'ccr-**']
    paths: ['mobile/**', 'server/public/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pages web embarquées à jour
        working-directory: .
        run: |
          sh mobile/tool/sync_web.sh
          git diff --exit-code -- mobile/assets/web || (echo "mobile/assets/web n'est pas synchronisé avec server/public : lancez mobile/tool/sync_web.sh" && exit 1)
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: omza-queue-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
