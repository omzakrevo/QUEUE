name: omza_queue
description: OMZA QUEUE - application borne de tickets et poste agent (Android / Windows).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  socket_io_client: ^3.0.2
  qr_flutter: ^4.1.0
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  shelf: ^1.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.2
  qr: ^3.0.3
  crypto: ^3.0.8
  sqflite_common: ^2.5.15
  print_bluetooth_thermal: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/tv/
    - assets/web/ticket/
    - assets/web/kiosk/
    - assets/web/agent/
    - assets/web/shared/
